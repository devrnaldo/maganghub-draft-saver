<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MagangHub Draft Keeper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon">
          <img src="../icons/icon.svg" class="brand-logo" alt="MagangHub Logo">
        </div>
        <div>
          <h1 class="brand-title">MagangHub Draft</h1>
          <p class="brand-subtitle">Autosave Monev Kemnaker</p>
        </div>
      </div>
      <div class="header-right">
        <button type="button" class="theme-toggle-btn" id="theme-toggle" title="Ganti Mode Gelap / Terang">
          <svg class="sun-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <div class="status-badge" id="status-badge">
          <span class="status-dot"></span>
          <span id="status-text">Siap</span>
        </div>
      </div>
    </header>

    <!-- Sync Notice (Google Drive / Canva style) -->
    <div class="sync-banner">
      <svg class="sync-banner-icon" width="14" height="14" viewBox="0 0 32 32" fill="currentColor">
        <path d="M24.96 12.649a9 9 0 0 0-17.917 0A7.5 7.5 0 0 0 8.5 27.5h15a7.5 7.5 0 0 0 1.46-14.851M23.5 25.5h-15a5.5 5.5 0 0 1-.423-10.978A1.02 1.02 0 0 0 9 13.5a7 7 0 0 1 14-.075v.1a1 1 0 0 0 .924 1A5.5 5.5 0 0 1 23.5 25.5"></path>
        <path d="M19.793 15.293 14.5 20.586l-2.293-2.293a1 1 0 0 0-1.414 1.414l3 3a1 1 0 0 0 1.414 0l6-6a1 1 0 0 0-1.414-1.414"></path>
      </svg>
      <span>Semua perubahan tersimpan otomatis</span>
    </div>

    <!-- Meta Info -->
    <div class="meta-card">
      <div class="meta-item">
        <span class="meta-label">Terakhir Disimpan</span>
        <span class="meta-val" id="last-saved-time">-</span>
      </div>
      <div class="meta-item meta-item-center">
        <span class="meta-label">Auto-Restore</span>
        <label class="toggle-switch">
          <input type="checkbox" id="toggle-autorestore" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Fields Accordion / Sections -->
    <main class="content-sections">
      <!-- 1. Uraian Aktivitas -->
      <div class="field-card">
        <div class="field-header">
          <div class="field-title-group">
            <span class="field-badge">1</span>
            <span class="field-name">Uraian Aktivitas</span>
          </div>
          <div class="field-actions">
            <span class="char-badge" id="badge-uraian">0 krt</span>
            <button class="icon-btn" id="btn-copy-uraian" title="Salin Uraian">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
          </div>
        </div>
        <textarea id="input-uraian" placeholder="Belum ada draft uraian aktivitas..."></textarea>
      </div>

      <!-- 2. Pembelajaran -->
      <div class="field-card">
        <div class="field-header">
          <div class="field-title-group">
            <span class="field-badge">2</span>
            <span class="field-name">Pembelajaran Diperoleh</span>
          </div>
          <div class="field-actions">
            <span class="char-badge" id="badge-pembelajaran">0 krt</span>
            <button class="icon-btn" id="btn-copy-pembelajaran" title="Salin Pembelajaran">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
          </div>
        </div>
        <textarea id="input-pembelajaran" placeholder="Belum ada draft pembelajaran..."></textarea>
      </div>

      <!-- 3. Kendala -->
      <div class="field-card">
        <div class="field-header">
          <div class="field-title-group">
            <span class="field-badge">3</span>
            <span class="field-name">Kendala Dialami</span>
          </div>
          <div class="field-actions">
            <span class="char-badge" id="badge-kendala">0 krt</span>
            <button class="icon-btn" id="btn-copy-kendala" title="Salin Kendala">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
          </div>
        </div>
        <textarea id="input-kendala" placeholder="Belum ada draft kendala..."></textarea>
      </div>
    </main>

    <!-- Footer Action Buttons -->
    <footer class="footer">
      <button class="btn btn-secondary" id="btn-copy-all">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        Salin Semua Draft
      </button>
      <button class="btn-text-danger" id="btn-clear-all">
        Hapus Semua Draft
      </button>
    </footer>

    <!-- Toast Notice in Popup -->
    <div id="popup-toast" class="toast">Disalin!</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
