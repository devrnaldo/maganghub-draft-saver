<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Simulasi Form Monev MagangHub Kemnaker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f1f5f9;
      margin: 0;
      padding: 30px;
      color: #1e293b;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
      color: #0f172a;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      background: #e0f2fe;
      color: #0369a1;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 13.5px;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      min-height: 90px;
    }
    textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    button {
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
    .btn-submit {
      background: #2563eb;
      color: #fff;
    }
    .btn-reload {
      background: #e2e8f0;
      color: #334155;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Halaman Pengujian Lokal Extension</div>
    <h2>Form Laporan Riwayat Aktivitas Harian</h2>
    <p style="color: #64748b; font-size: 13px; margin-bottom: 24px;">
      Gunakan form simulasi ini untuk mencoba extension sebelum dipasang di halaman monev MagangHub yang sebenarnya.
    </p>

    <form id="laporanForm">
      <!-- 1. Uraian aktivitas -->
      <div class="form-group">
        <label for="uraian_aktivitas">Uraian Aktivitas :</label>
        <textarea id="uraian_aktivitas" name="uraian_aktivitas" placeholder="Tuliskan aktivitas yang dikerjakan hari ini..."></textarea>
      </div>

      <!-- 2. Pemelajaran yang diperoleh -->
      <div class="form-group">
        <label for="pemelajaran">Pemelajaran yang diperoleh :</label>
        <textarea id="pemelajaran" name="pemelajaran" placeholder="Tuliskan ilmu baru, keahlian atau pemelajaran yang didapat..."></textarea>
      </div>

      <!-- 3. Kendala yang dialami -->
      <div class="form-group">
        <label for="kendala">Kendala yang dialami :</label>
        <textarea id="kendala" name="kendala" placeholder="Tuliskan kendala atau hambatan selama magang..."></textarea>
      </div>

      <div class="actions">
        <button type="submit" class="btn-submit">Kirim Laporan</button>
        <button type="button" class="btn-reload" onclick="window.location.reload()">Simulasi Reload Halaman (F5)</button>
      </div>
    </form>
  </div>
</body>
</html>
